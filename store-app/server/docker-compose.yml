version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd
      MYSQL_DATABASE: productdb
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

  api:
    build:
      context: ./server
    depends_on:
      - db
    environment:
      - ConnectionStrings__DefaultConnection=server=db;port=3306;database=productdb;user=root;password=rootpwd;
    ports:
      - "5000:80"
volumes:
  db-data:
